<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Exercicio bootstrap</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="alert alert-dark alert-dismissible">
                    <button class="btn-close" data-bs-dismiss="alert"></button>
                    MENSAGEM DE TESTE 
            </div>
        </div>
    </div>
    <div>
        <form>
            <label class="formlabel" for="name">Your Name:</label>
            <input class="form-control" type="text" id="Name">
            <label class="formlabel" for="E-mail">E-mail:</label>
            <input class="form-control" type="text" id="E-mail">
            <label class="formlabel" for="tel">Tel:</label>
            <input class="form-control" type="tel" id="Tel">
            <div class="form-check form-switch">
                <label class="form-check-label" for="Aceito Termos">Li e concordo com os termos da pagina</label>
                <input type="checkbox" class="form-check-input"id="Aceito Termos">
            </div>
            <button class="btn btn-success">Submit</button>
        </form>

        </div>
    </div>
    <SCript src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></SCript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <title>CardsBS</title>
    <style>
        .carousel.carousel-fade.slide {
            max-width: 700px;
            margin: 0 auto;  /* Centraliza o carrossel na tela */
        }

        .carousel-inner img {
            width: 100%;
            height: auto;  /* Faz as imagens se ajustarem ao tamanho do carrossel */
        }
    </style>
</head>
<body>
    <div id="carousel" class="carousel carousel-fade slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div data-bs-interval="1000" class="carousel-item active">
                <img src="https://www.shutterstock.com/image-photo/black-ukulele-isolated-on-background-260nw-2355061895.jpg" alt="Ukulele">
            </div>
            <div data-bs-interval="1000" class="carousel-item">
                <img src="https://i.scdn.co/image/ab6761610000e5ebd19de1859567e3305f238758" alt="Imagem 2">
            </div>
            <div data-bs-interval="1000" class="carousel-item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSITh_6l8MDD-lrU4jypfQhN_l9rapSNjJPow&s" alt="Imagem 3">
            </div>
        </div>
        <button data-bs-target="#carousel" data-bs-slide="prev" class="carousel-control-prev" type="button">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button data-bs-target="#carousel" data-bs-slide="next" class="carousel-control-next" type="button">
            <span class="carousel-control-next-icon"></span>
        </button>
        <div class="carouseu-indicators"></div>
        <button type="button" data-bs-target="#carousel" class="active" data-bs-slide-to="0"></button>
        <button type="button" data-bs-target="#carousel"data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carousel"data-bs-slide-to="2"></button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
